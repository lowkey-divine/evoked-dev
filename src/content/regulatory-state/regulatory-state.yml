last_verified: "2026-11-18"
verified_by: "Claude Code session with Captain Europa + WebSearch. CAVEAT ON SOURCE AUTHORITY: direct reads of EUR-Lex (ELI, CELEX, and the consolidated 2026-07-27 text) all returned empty documents, apparently JS-gated. The OJ citation, publication date, entry-into-force date, and provision scoping below are corroborated across multiple independent secondary sources (Cuatrecasas, Garrigues, Gibson Dunn, Orrick, ERTICO, nicfab.eu, ActuIA, Reed Smith) but NO primary OJ text was read. Per README source-authority hierarchy these are level 6-7. A primary read is still owed before any of this is quoted as provision text. Prior verification 2026-07-11, which left this file 122 days overdue on a weekly cadence while asserting the Omnibus was unpublished."
